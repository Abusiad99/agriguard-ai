# AgriGuard AI — NGINX reverse proxy configuration.
# Terminates TLS (production), reverse-proxies /api and /storage to the backend,
# applies request size limits matching MAX_UPLOAD_SIZE_BYTES, and serves the
# frontend's static build directly (Phase 4). NFR-SEC-1, NFR-SCALE-1.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 16M;  # slightly above MAX_UPLOAD_SIZE_BYTES (15MB) for multipart overhead

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Rate limiting at the edge, complementing the application-level
    # RateLimitMiddleware (defense in depth, NFR-SEC-5).
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

    upstream backend_upstream {
        # Docker Compose service DNS name; scales horizontally by adding replicas
        # (NFR-SCALE-1) — `docker compose up --scale backend=3` works unmodified
        # since Docker's embedded DNS round-robins across replicas of the same
        # service name.
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # --- Security headers (defense in depth alongside SecurityHeadersMiddleware) ---
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # --- Health check passthrough (no rate limiting; used by orchestration) ---
        location = /health {
            proxy_pass http://backend_upstream/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # --- Auth endpoints: tighter rate limit ---
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- General API ---
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;   # AI inference can take several seconds (NFR-PERF-1)
        }

        # --- OpenAPI docs ---
        location /api/docs {
            proxy_pass http://backend_upstream/api/docs;
            proxy_set_header Host $host;
        }
        location /api/openapi.json {
            proxy_pass http://backend_upstream/api/openapi.json;
            proxy_set_header Host $host;
        }

        # --- Locally-stored images/heatmaps/reports (dev/small-scale deployments;
        #     production should serve these from S3/CDN directly) ---
        location /storage/ {
            proxy_pass http://backend_upstream/storage/;
            proxy_set_header Host $host;
        }

        # --- Frontend static build (Phase 4) ---
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
