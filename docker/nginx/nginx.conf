# AgriGuard AI — NGINX reverse proxy configuration.
# Terminates TLS (production), reverse-proxies /api and /storage to the backend,
# applies request size limits matching MAX_UPLOAD_SIZE_BYTES, and serves the
# frontend's static build directly (Phase 4). NFR-SEC-1, NFR-SCALE-1.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 16M;  # slightly above MAX_UPLOAD_SIZE_BYTES (15MB) for multipart overhead

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Rate limiting at the edge, complementing the application-level
    # RateLimitMiddleware (defense in depth, NFR-SEC-5). The backend applies the precise
    # per-address limits; these only stop floods. A rejected request gets 429 (NGINX's
    # default would be 503) with the API's JSON error body, see the error_page lines below.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;
    limit_req_status 429;

    # Public deployment (docker-compose.prod.yml) puts an HTTPS proxy in front of NGINX and
    # adds conf.d/agriguard-real-ip.conf, which takes the visitor's address from that
    # proxy's X-Forwarded-For. Without the file (local use) nothing is included, and
    # $remote_addr is whoever connected to NGINX.
    include /etc/nginx/conf.d/agriguard-*.conf;

    # Scheme the visitor used: "https" when the HTTPS proxy says so, else NGINX's own.
    map $http_x_forwarded_proto $agriguard_forwarded_proto {
        default $scheme;
        https   https;
    }

    upstream backend_upstream {
        # Docker Compose service DNS name. Several replicas would be round-robined by
        # Docker's DNS, but the compose file gives the backend a fixed container_name,
        # which Compose refuses to scale (see docker/README.md, production notes).
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # --- Security headers (defense in depth alongside SecurityHeadersMiddleware) ---
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # --- Errors NGINX itself produces get the API's JSON error body, so the app shows a
        #     specific, translated message instead of "Something went wrong". Errors the
        #     backend returns pass through unchanged (proxy_intercept_errors is off). ---
        error_page 429 = @too_many_requests;
        error_page 413 = @upload_too_large;
        error_page 502 503 504 = @backend_unavailable;

        location @too_many_requests {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please wait a minute and try again.","details":[]},"request_id":null}';
        }
        location @upload_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"The file is too large.","details":[]},"request_id":null}';
        }
        location @backend_unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable. Please try again shortly.","details":[]},"request_id":null}';
        }

        # --- Health check passthrough (no rate limiting; used by orchestration) ---
        location = /health {
            proxy_pass http://backend_upstream/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # --- Auth endpoints: tighter rate limit ---
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth_zone burst=20 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $agriguard_forwarded_proto;
        }

        # --- Scan upload: same as the general API, with a longer read timeout. A scan
        #     runs inference, weather, up to ~7 Gemini calls (20s timeout each) and PDF
        #     rendering; at 60s nginx would return 504 while the backend still saves
        #     the diagnosis, and the user's retry would create a duplicate. ---
        location = /api/v1/scans {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $agriguard_forwarded_proto;
            proxy_read_timeout 180s;
        }

        # --- General API ---
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $agriguard_forwarded_proto;
            proxy_read_timeout 60s;   # AI inference can take several seconds (NFR-PERF-1)
        }

        # --- OpenAPI docs ---
        location /api/docs {
            proxy_pass http://backend_upstream/api/docs;
            proxy_set_header Host $host;
        }
        location /api/openapi.json {
            proxy_pass http://backend_upstream/api/openapi.json;
            proxy_set_header Host $host;
        }

        # --- Locally-stored images/heatmaps/reports (dev/small-scale deployments;
        #     production should serve these from S3/CDN directly) ---
        location /storage/ {
            proxy_pass http://backend_upstream/storage/;
            proxy_set_header Host $host;
        }

        # --- Frontend static build (Phase 4) ---
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
