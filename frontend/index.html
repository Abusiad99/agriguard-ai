<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#05130E" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="AgriGuard AI — AI-powered plant disease and pest diagnosis for farmers." />
    <title>AgriGuard AI</title>
    <script>
      // Apply the saved theme and text direction before first paint, so a dark-mode
      // or Arabic user never sees a flash of the wrong theme or layout.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("agriguard_theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (theme === "dark") root.classList.add("dark");
          var locale = localStorage.getItem("agriguard_locale");
          if (!locale) locale = (navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
          root.lang = locale;
          root.dir = locale === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
