# Deployment settings for Vercel, the free public demo (docs/SETUP_AND_RUN.md section 9.9).
# Only Vercel reads this file. Local development, Docker and the tests install
# backend/requirements.txt (+ ai/requirements.txt for training and inference).
#
# The dependencies are backend/requirements.txt without the test-only packages, and without
# ai/requirements.txt: PyTorch does not fit Vercel's free plan, so scans answer "no image
# classifier is installed" there. backend/tests/unit/test_vercel_deployment.py fails if this
# list and backend/requirements.txt drift apart.

[project]
name = "agriguard-ai"
version = "1.0.0"
description = "AgriGuard AI - plant disease diagnosis and crop monitoring (Vercel deployment)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.31.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "redis>=5.0.4",
    "reportlab>=4.2.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "qrcode[pil]>=7.4.2",
    "Pillow>=10.2.0",
    "numpy>=1.26.0",
    "google-genai>=1.0.0,<3.0.0",
]

[tool.uv]
package = false  # an application, not a library: install the dependencies only

[tool.vercel]
entrypoint = "asgi:app"

[tool.vercel.scripts]
# Applies database migrations (production deployments only) and builds the React app.
build = "python scripts/vercel_build.py"

[tool.vercel.fastapi.static]
# Serve the React app from Vercel's CDN even though the app has middleware: the frontend
# files are public and need none of it.
cdn = true
